<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nanyang Dashboards</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#eef3f8;color:#172033}body{display:flex;flex-direction:column}.topbar{height:68px;background:#fff;border-bottom:1px solid #dce5ef;display:flex;align-items:center;padding:0 24px;gap:28px;box-shadow:0 2px 8px rgba(15,23,42,.05);z-index:2}.brand{font-weight:800;font-size:20px;white-space:nowrap}.tabs{height:100%;display:flex;align-items:stretch;gap:6px}.tab{border:0;background:transparent;padding:0 22px;font-size:14px;font-weight:700;color:#64748b;cursor:pointer;border-bottom:3px solid transparent}.tab:hover{color:#1d4ed8;background:#f8fafc}.tab.active{color:#1d4ed8;border-bottom-color:#1d4ed8;background:#eff6ff}.frame-wrap{flex:1;min-height:0;padding:12px}.frame{width:100%;height:100%;border:0;border-radius:14px;background:#fff;box-shadow:0 4px 18px rgba(15,23,42,.08)}@media(max-width:640px){.topbar{padding:0 10px;gap:8px}.brand{font-size:16px}.tab{padding:0 12px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">NANYANG DASHBOARD</div>
    <nav class="tabs" aria-label="Dashboard tabs">
      <button class="tab active" data-page="vvic">VVIC</button>
      <button class="tab" data-page="easy-lean">EASY LEAN</button>
    </nav>
  </header>
  <main class="frame-wrap">
    <iframe id="dashboard" class="frame" title="Nanyang dashboard"></iframe>
  </main>
  <script>
    const urls={
      'vvic': window.NANYANG_VVIC_URL || 'http://localhost:5173',
      'easy-lean': window.NANYANG_EASY_LEAN_URL || 'http://localhost:5174'
    };
    const frame=document.getElementById('dashboard');
    const tabs=[...document.querySelectorAll('.tab')];
    function openPage(page){
      frame.src=urls[page];
      tabs.forEach(t=>t.classList.toggle('active',t.dataset.page===page));
      history.replaceState(null,'','#'+page);
    }
    tabs.forEach(t=>t.addEventListener('click',()=>openPage(t.dataset.page)));
    const initial=location.hash.slice(1);
    openPage(urls[initial]?initial:'vvic');
  </script>
</body>
</html>
